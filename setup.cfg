[metadata]
name = scry-ms
author = Seth Just
author_email = sjust@seer.bio
description = Extreme-scale search pipeline from Seer
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/seerbio/scry
project_urls =
    Bug Tracker = https://github.com/seerbio/scry/issues
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent
    Topic :: Scientific/Engineering :: Bio-Informatics

[options]
packages = find:
python_requires = >=3.8
install_requires =
    pyspark[sql]

    click

    fsspec

    wheely-mammoth>=0.5.0,<2.0.0
    airpot>=0.2.3,<2.0.0
    cortado-ms>=0.5.1,<2.0.0

[options.extras_require]
toml =
    toml
s3 =
    s3fs
docs =
    numpydoc>=1.0.0
    sphinx-argparse>=0.2.5
    sphinx-rtd-theme>=0.5.0
    nbsphinx>=0.7.1
    ipykernel>=5.3.0
    recommonmark>=0.5.0
dev =
    pre-commit>=2.7.1
    black>=20.8b1
    pytest
    mypy
    types-setuptools
    types-toml

[options.entry_points]
console_scripts =
    scry = scry.cli:main
