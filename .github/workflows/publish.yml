# This workflows will upload a Python Package using Twine when a release is created
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Deploy to CodeArtifact

on:
  release:
    types: [created]

jobs:
  deploy-pkg:
    runs-on: [self-hosted, aws-master, X64]

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        pip config unset global.index-url || true  # Ensure we don't have old CodeArtifact creds in pip config
        python -m pip install --upgrade pip
        pip install setuptools wheel twine build
        aws codeartifact login --tool twine --repository seer_ds --domain seer --domain-owner 718843040700 --region us-west-2
    - name: Build and publish
      run: |
        python -m build --sdist --wheel .
        twine upload --repository codeartifact dist/*

  build-docs:
    runs-on: ubuntu-latest
    needs: deploy-pkg
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'
      - name: Set up Sphinx + AutoAPI
        run: pip install sphinx sphinx-autoapi
      - name: Render documentation
        run: |
          make -C docs html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v2
        with:
          path: docs/_build/html/

  deploy-docs:
    runs-on: ubuntu-latest
    needs: build-docs
    environment:
      name: github-pages
      url: ${{steps.deployment.outputs.page_url}}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v2
